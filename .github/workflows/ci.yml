name: CI
# napi-rs 3.x 多平台构建。CLI 3.x 实测坑(2026-10-08):
#   - napi build --target 产物名恒为裸 whois-binding.node,smoke 加载器与
#     napi artifacts 都只认平台限定名 → 每腿 build 后按 abi 改名
#   - napi artifacts 要 artifacts/ 下全目标限定名 .node(缺一即炸),
#     download-artifact 不得 merge-multiple(裸名六腿相撞)
#   - aarch64-gnu 交叉需显式 linker env(host ld 咬 aarch64 目标件)

on:
  push:
    branches: [main]
  tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            abi: darwin-arm64
          - target: x86_64-apple-darwin
            abi: darwin-x64
          - target: x86_64-unknown-linux-gnu
            abi: linux-x64-gnu
          - target: aarch64-unknown-linux-gnu
            abi: linux-arm64-gnu
          - target: x86_64-unknown-linux-musl
            abi: linux-x64-musl
          - target: x86_64-pc-windows-msvc
            abi: win32-x64-msvc
    runs-on: ${{ contains(matrix.target, 'apple') && 'macos-latest' || (contains(matrix.target, 'windows') && 'windows-latest' || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          targets: ${{ matrix.target }}
      - name: Install cross toolchain (linux non-x86_64-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
      - uses: swatinem/rust-cache@v2
      - run: npm install -g @napi-rs/cli
      - name: Build
        run: napi build --target ${{ matrix.target }} --release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Rename to platform-qualified name
        shell: bash
        run: mv whois-binding.node whois-binding.${{ matrix.abi }}.node
      - name: Smoke (host platform only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: node -e "const m = require('./index.js'); m.lookup('iana.org').then(r => console.log('whois LEN=' + r.length), e => { console.error('FAIL', e.message ?? e); process.exit(1); })"
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: whois-binding.*.node

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: artifacts
      - run: npm install -g @napi-rs/cli
      - name: Publish platform packages
        run: napi artifacts && napi prepublish -t npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish root package
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
