[package]
name = "whois-binding"
version = "0.1.0"
edition = "2021"
description = "napi-rs binding for whois-rust (TCP 43 WHOIS) - TS sees Promise<string>"
license = "Apache-2.0"
repository = "https://github.com/raystyle/whois_rs"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"
whois-rust = "=3.1.0"
once_cell = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
